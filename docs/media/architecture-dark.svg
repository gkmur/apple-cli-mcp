<text class="sans" x="420" y="707" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">bearer token</text>
<rect x="400" y="736" width="300" height="96" rx="10" fill="#16161A" stroke="#2C2C31" stroke-width="1" stroke-dasharray="5 4"/>
<text class="sans" x="420" y="772" font-size="18" font-weight="600" fill="#F2F2F4" text-anchor="start">Cloudflare Access</text>
<text class="sans" x="420" y="798" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">tunnel, optional</text>
<text class="sans" x="420" y="819" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">signed Access header checked</text>
