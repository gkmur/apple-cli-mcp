<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="876" viewBox="0 0 1280 876" role="img" aria-label="apple-cli architecture. Agents call apple-cli over the CLI, MCP on stdio, or MCP over HTTP. A privacy filter drops hidden items inside every read. Per-app readers and writers use SQLite stores read-only, EventKit, the Contacts framework, PhotoKit, and AppleScript for Notes writes. A laptop can route whole apps over Tailscale to an always-on Mac running apple-cli serve, with an optional Cloudflare Access listener for claude.ai.">
