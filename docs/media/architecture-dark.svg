<text class="mono" x="298" y="256.0" font-size="16" font-weight="600" fill="#F2F2F4" text-anchor="start">MCP</text>
<text class="sans" x="350" y="256.0" font-size="16" font-weight="400" fill="#A6A6AD" text-anchor="start">stdio</text>
<text class="mono" x="298" y="296.0" font-size="16" font-weight="600" fill="#F2F2F4" text-anchor="start">MCP</text>
<text class="sans" x="350" y="296.0" font-size="16" font-weight="400" fill="#A6A6AD" text-anchor="start">HTTP, bearer token</text>
<line x1="298" y1="338.0" x2="498" y2="338.0" stroke="#2C2C31"/>
<text class="sans" x="298" y="370.0" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">One command table</text>
<text class="sans" x="298" y="394.0" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">for every app</text>
<text class="sans" x="298" y="428.0" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">Deletes: CLI only</text>
<text class="sans" x="298" y="462.0" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">Texts, email:</text>
<text class="sans" x="298" y="486.0" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">draft, then send</text>
<rect x="560" y="112.0" width="156" height="392" rx="10" fill="#2A1414" stroke="#F0332E" stroke-width="1"/>
<text class="sans" x="578" y="155.0" font-size="18" font-weight="600" fill="#F2F2F4" text-anchor="start">Privacy filter</text>
<text class="sans" x="578" y="216.0" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">Hidden notes,</text>
<text class="sans" x="578" y="240.0" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">chats, contacts,</text>
<text class="sans" x="578" y="264.0" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">lists, mailboxes</text>
<text class="sans" x="578" y="288.0" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">are dropped</text>
<text class="sans" x="578" y="312.0" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">inside every read.</text>
<text class="sans" x="578" y="360.0" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">No command</text>
<text class="sans" x="578" y="384.0" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">can print them.</text>
