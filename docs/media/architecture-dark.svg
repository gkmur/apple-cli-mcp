<text class="sans" x="60" y="686" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">remote.url routes whole apps:</text>
<text class="sans" x="60" y="707" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">Mail, Messages, Reminders, ...</text>
