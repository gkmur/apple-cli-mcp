<text class="sans" x="1022" y="770" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">Same version on</text>
<text class="sans" x="1022" y="792" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">both Macs. Deletes</text>
<text class="sans" x="1022" y="814" font-size="15" font-weight="400" fill="#A6A6AD" text-anchor="start">stay with the CLI.</text>
